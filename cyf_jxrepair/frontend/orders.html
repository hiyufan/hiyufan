<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工单列表 · CYF捷修云</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <main class="content">
    <div class="page-head">
      <div><h1 id="pageTitle">工单列表</h1><p id="pageDesc"></p></div>
      <a class="btn btn-primary hidden" id="newBtn" href="report.html"></a>
    </div>

    <section class="panel">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="toolbar">
        <div class="input-icon search" id="searchBox">
          <input class="input" id="keyword" type="search" placeholder="搜索工单号 / 故障描述 / 设备 / 报修人">
        </div>
        <select class="input" id="urgency" aria-label="紧急程度">
          <option value="">全部紧急程度</option>
          <option value="HIGH">紧急</option>
          <option value="NORMAL">较急</option>
          <option value="LOW">一般</option>
        </select>
        <span class="spacer"></span>
        <button class="btn btn-ghost btn-sm" type="button" id="refreshBtn">刷新</button>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr><th>工单号</th><th>设备</th><th>故障描述</th><th>紧急</th><th>状态</th><th>报修人</th><th>维修工</th><th>提交时间</th><th class="actions">操作</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="pager"></div>
    </section>
  </main>
  <script type="module" src="js/pages/orders.js"></script>
</body>
</html>
