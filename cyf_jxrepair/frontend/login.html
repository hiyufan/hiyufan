<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · CYF捷修云</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="topbar login-top">
    <div class="topbar-inner">
      <span class="wordmark"><span class="wordmark-plate">CYF</span><span class="wordmark-name">捷修云 · 设备报修与维修工单</span></span>
      <span class="who">闽榕智造 · 设备科</span>
    </div>
  </header>

  <main class="login-wrap">
    <form class="login-form" id="loginForm" novalidate>
      <h1>登录</h1>
      <p>使用设备科分配的工号账号</p>
      <div id="notice"></div>
      <div class="field">
        <label for="username">账号</label>
        <input class="input" id="username" name="username" autocomplete="username" placeholder="如 emp01" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <div style="position:relative">
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="btn btn-ghost btn-sm pwd-toggle" id="pwdToggle">显示</button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">登录</button>
    </form>

    <div class="login-side">
      <section>
        <h2>报修处理流程</h2>
        <ol class="flow" id="flow"></ol>
      </section>
      <section>
        <h2>工单状态色（GB 2893 安全色）</h2>
        <div class="legend" id="legend"></div>
      </section>
      <section>
        <h2>演示账号 · 初始密码 123456 · 点击行填入</h2>
        <div class="panel table-wrap">
          <table class="table demo-table">
            <thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>登录后</th></tr></thead>
            <tbody id="demoRows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
