<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工单详情 · CYF捷修云</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <main class="content">
    <div style="margin-bottom:12px"><a class="btn btn-ghost btn-sm" id="backBtn" href="orders.html">← 返回列表</a></div>

    <div class="split">
      <article class="docket" id="docket"><div class="panel-body"><div class="skeleton" style="width:40%"></div></div></article>

      <div class="grid">
        <section class="panel">
          <div class="panel-head"><h3>工单摘要</h3><span class="extra" id="summaryEngine"></span></div>
          <div class="panel-body" id="summary"><div class="skeleton"></div></div>
        </section>
        <section class="panel hidden" id="similarCard">
          <div class="panel-head"><h3>相似历史案例</h3><span class="extra">维修知识库</span></div>
          <div class="panel-body" id="similar" style="padding-block:4px"></div>
        </section>
      </div>
    </div>

    <section class="panel" style="margin-top:16px">
      <div class="panel-head"><h3>流转记录</h3><span class="extra" id="logCount"></span></div>
      <div class="table-wrap">
        <table class="table log-table">
          <thead><tr><th>时间</th><th>操作</th><th>操作人</th><th>状态变化</th><th>内容</th></tr></thead>
          <tbody id="logs"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="js/pages/order-detail.js"></script>
</body>
</html>
