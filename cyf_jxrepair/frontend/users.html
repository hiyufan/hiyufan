<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户管理 · CYF捷修云</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <main class="content">
    <div class="page-head">
      <div><h1>人员</h1><p id="pageDesc"></p></div>
      <button class="btn btn-primary" type="button" id="addBtn"></button>
    </div>
    <section class="panel">
      <div class="toolbar">
        <div class="input-icon search" id="searchBox"><input class="input" id="keyword" type="search" placeholder="账号 / 姓名 / 手机号"></div>
        <select class="input" id="role" aria-label="角色"><option value="">全部角色</option></select>
        <select class="input" id="dept" aria-label="部门"><option value="">全部部门</option></select>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>所属部门</th><th>手机号</th><th>擅长方向</th><th>状态</th><th class="actions">操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="pager"></div>
    </section>
  </main>
  <script type="module" src="js/pages/users.js"></script>
</body>
</html>
