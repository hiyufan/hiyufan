<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我要报修 · CYF捷修云</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <main class="content">
    <div class="page-head">
      <div><h1 id="pageTitle">设备报修</h1><p id="pageDesc">写清现象（声音、气味、报警号、发生时间），设备科能更快判断派谁去。</p></div>
    </div>

    <div id="rejectBanner"></div>

    <div class="split">
      <form class="panel report-form" id="reportForm" novalidate>
        <div class="panel-body">
          <div class="form-row">
            <div class="field">
              <label for="deviceId">报修设备<span class="req">*</span></label>
              <select class="input" id="deviceId" name="device_id" required><option value="">加载中…</option></select>
              <div class="device-hint" id="deviceHint"></div>
            </div>
            <div class="field">
              <label>紧急程度</label>
              <div class="segmented" id="urgency">
                <label><input type="radio" name="urgency" value="LOW"><span>一般</span></label>
                <label><input type="radio" name="urgency" value="NORMAL" checked><span>较急</span></label>
                <label><input type="radio" name="urgency" value="HIGH"><span>紧急</span></label>
              </div>
              <span class="hint">紧急 = 有安全隐患或导致整线停产</span>
            </div>
          </div>

          <div class="field">
            <label for="faultDesc">故障描述<span class="req">*</span></label>
            <textarea class="input" id="faultDesc" name="fault_desc" maxlength="500" rows="5"
              placeholder="例如：主轴运转时有明显异响，加工表面出现振纹。可写明声音、气味、报警号、发生时间等"></textarea>
            <span class="char-count"><span id="descCount">0</span>/500</span>
          </div>

          <div class="field">
            <label>现场照片</label>
            <div id="photoPicker"></div>
            <span class="hint">支持 jpg / png，单张不超过 5MB，最多 3 张</span>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" type="button" id="resetBtn">重置</button>
          <button class="btn btn-primary" type="submit" id="submitBtn">提交报修</button>
        </div>
      </form>

      <aside class="panel side-panel">
        <div class="panel-head"><h3>故障初判</h3><span class="extra" id="aiEngine"></span></div>
        <div class="panel-body" id="aiBody"></div>
        <div class="panel-head" style="border-top:1px solid var(--rule)"><h3>相似历史案例</h3><span class="extra">维修知识库</span></div>
        <div class="panel-body" id="similarBody" style="padding-block:4px 8px"></div>
      </aside>
    </div>
  </main>
  <script type="module" src="js/pages/report.js"></script>
</body>
</html>
