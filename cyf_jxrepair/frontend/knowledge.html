<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>维修知识库 · CYF捷修云</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <main class="content">
    <div class="page-head">
      <div><h1>维修知识库</h1><p>已归档工单的故障现象与处理方法自动沉淀为知识库，按语义相似度检索</p></div>
    </div>
    <section class="card">
      <form class="kb-search" id="searchForm">
        <div class="input-icon" id="searchBox" style="flex:1">
          <input class="input" id="q" type="search" placeholder="描述故障现象，例如：油缸漏油、压力下降" maxlength="100" autocomplete="off">
        </div>
        <button class="btn btn-primary btn-lg" type="submit">检索</button>
      </form>
      <div class="kb-hot" id="hot"></div>
      <div id="results"></div>
    </section>
  </main>
  <script type="module" src="js/pages/knowledge.js"></script>
</body>
</html>
